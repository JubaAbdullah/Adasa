<section class="values" >
  <h2 class="values__title">قيمنا</h2>
  <p class="values__subtitle">المبادئ التي توجه كل ما نقوم بإنشائه</p>

    <div class="values__grid row row-gap-5">

        @for (value of values; track $index) {
            <div class="col-6 col-md-4 col-xl-3">
              <app-value-component [value]="value"></app-value-component>
            </div>
        }



    </div>
</section>
