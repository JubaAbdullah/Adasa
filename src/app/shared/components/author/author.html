
<div class="team-card">

  <!-- Member Image -->
  <div class="member-image-wrapper">
    <img
      [src]="author.author.avatar"
      [alt]="author.author.name"
      class="member-image"
    >

    <span class="verified-badge">
      <i class="fa-solid fa-check" aria-hidden="true"></i>
    </span>
  </div>

  <!-- Member Information -->
  <div class="member-info">
    <h3 class="member-name">{{author.author.name}}</h3>
    <p class="member-role">{{author.author.role}}</p>
  </div>

  <!-- Social Links -->
  <div class="member-socials">
    <a href="#" class="social-link social-link-1" aria-label="LinkedIn">
      <i class="fa-brands fa-linkedin-in"></i>
    </a>

    <a href="#" class="social-link social-link-2" aria-label="GitHub">
      <i class="fa-brands fa-github"></i>
    </a>

    <a href="#" class="social-link social-link-3" aria-label="X">
      <i class="fa-brands fa-x-twitter"></i>
    </a>
  </div>

</div>
