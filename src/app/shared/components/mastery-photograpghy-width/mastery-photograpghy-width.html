<div class="container">
    <a class="text-decoration-none d-block pt-4">
        <div class="card position-relative h-100" [routerLink]="['/blog', article.slug]">
            <div class="row">
                <!-- Col-Image -->
                <div class="col-md-6 overflow-hidden">
                    <img class="img-fluid h-100 w-100 object-fit-cover" [src]="article.image" [alt]="article.author">
                    <div class="text-over">
                        <i class="fa-solid fa-star"></i>
                        <span>مميز</span>
                    </div>
                </div>
                <!-- Col-Content -->
                <div class="col-md-6 d-flex align-content-between justify-content-start flex-column">
                    <div class="card-body">
                        <div class="parent d-flex justify-content-start align-items-center gap-3 mb-1">
                            <div class="light-card">
                                <span>{{article.category}}</span>
                            </div>
                            <div class="hours d-flex gap-1">
                                <span class="icon-width">
                                    <i class="fa-regular fa-clock"></i>
                                </span>
                                <span>{{article.readTimeMinutes}}</span>
                            </div>

                        </div>
                        <h3 class="card-title mt-3 mb-0">{{article.title}}</h3>
                        <p class="card-text mt-3">
                           {{article.excerpt}}
                        </p>
                    </div>
                    <div class="card-footer d-flex justify-content-between align-items-center mt-auto">
                        <div class="d-flex gap-2 align-items-center position-relative">

                            <img class="image-card" [src]="article.author.avatar" [alt]="article.author.name">
                            <div class="dot-image"></div>


                            <div>
                                <p class="mb-0 fw-medium text-white class-name">{{article.author.name}}</p>
                                <div class="data d-flex gap-1">
                                    <span>{{article.date}}</span>
                                </div>
                            </div>

                            



                        </div>

                        <div class="d-flex justify-content-center align-items-center article-write gap-2">
                                <span class="move">أقرأ المقال</span>
                                <i class="fa-solid fa-arrow-left-long"></i>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </a>
</div>
